; -----------------------------------------------------------------------------
; Limites PHP alignées avec la politique de l'application (images <= 8 Mo).
;
; Pourquoi ces valeurs ?
;  - upload_max_filesize : taille max D'UN fichier uploadé (la règle métier = 8 Mo).
;  - post_max_size       : taille max de TOUTE la requête POST. Doit être un peu
;                          plus grande que upload_max_filesize pour couvrir
;                          l'overhead multipart + les autres champs du formulaire.
;
; Sans ce réglage, post_max_size valait 8 Mo : une image de 8 Mo dépassait la
; taille totale du POST et PHP rejetait la requête AVANT Symfony (warning brut).
;
; NB : ce fichier .user.ini est lu par PHP en SAPI FPM/CGI (MAMP, `symfony serve`
; avec FPM). Avec le serveur intégré `php -S`, passez plutôt les valeurs en ligne
; de commande (voir README).
; -----------------------------------------------------------------------------
upload_max_filesize = 8M
post_max_size = 12M

; Ne pas laisser fuiter les warnings PHP bruts dans la page : Symfony gère déjà
; l'affichage des erreurs (belle page d'exception en dev, log en prod).
display_errors = Off

