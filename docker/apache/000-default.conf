<VirtualHost *:80>
    ServerName localhost

    # --- Transmission des variables d'environnement à PHP (mod_php) ---
    # Sans ceci, les variables définies par Docker/l'hébergeur ne sont pas
    # exposées dans $_SERVER, et Symfony retomberait sur les valeurs du .env
    # (donc APP_ENV=dev). PassEnv les fait passer de l'environnement Apache
    # vers PHP.
    PassEnv APP_ENV
    PassEnv APP_DEBUG
    PassEnv APP_SECRET
    PassEnv DATABASE_URL
    PassEnv MAILER_DSN
    PassEnv MESSENGER_TRANSPORT_DSN

    # La racine web d'une application Symfony est le dossier public/.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # On n'utilise pas de .htaccess : tout est défini ici.
        AllowOverride None
        Require all granted

        # Les fichiers réels (CSS, images, uploads) sont servis directement ;
        # toute autre URL est renvoyée au contrôleur frontal Symfony.
        FallbackResource /index.php
    </Directory>

    # Bloque l'accès direct au dossier des sources hors public/.
    <DirectoryMatch "^/var/www/html/(?!public)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>


